<!DOCTYPE html>
<!-- Kapak görseli: ?w=1200&h=630 (og-image) ya da ?w=1600&h=1000 (portfolyo kartı) -->
<html lang="tr"><head><meta charset="utf-8"><style>
  html, body { margin: 0; overflow: hidden; }
  .stage { position: relative; overflow: hidden;
    background: radial-gradient(900px 600px at 80% 10%, rgba(47, 91, 216, .28), transparent 60%),
                radial-gradient(700px 500px at 10% 100%, rgba(22, 163, 127, .18), transparent 60%), #eef1f6; }
  .phone { position: absolute; width: 380px; height: 823px; border-radius: 58px; background: #14161a; padding: 12px; box-sizing: border-box;
    box-shadow: 0 50px 90px -30px rgba(20, 22, 26, .5), 0 18px 40px -20px rgba(20, 22, 26, .4); }
  .screen { width: 100%; height: 100%; border-radius: 46px; overflow: hidden; padding-top: 40px; box-sizing: border-box; background: var(--bar); }
  .screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .phone::after { content: ''; position: absolute; top: 24px; left: 50%; width: 92px; height: 24px; transform: translateX(-50%); border-radius: 20px; background: #14161a; }
  .p1 { --bar: #f5f6f8; transform: rotate(-6deg); }
  .p2 { --bar: #f5f6f8; z-index: 2; }
  .p3 { --bar: #0f1115; transform: rotate(6deg); }
  .brand { position: absolute; font: 800 44px system-ui, -apple-system, sans-serif; color: #14161a; display: flex; align-items: center; gap: 14px; letter-spacing: -.02em; }
  .brand small { display: block; font-weight: 600; font-size: 22px; color: #5d6470; letter-spacing: 0; }
  .brand svg { width: 64px; height: 64px; }
</style></head><body>
<div class="stage" id="stage">
  <div class="brand" id="brand"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#2f5bd8"/><g fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="16" width="38" height="34" rx="8"/><path d="M13 26h38M23 11v8M41 11v8"/></g><path fill="#fff" d="M35.5 30.5a7 7 0 1 0 3.2 10.4 5.6 5.6 0 0 1-3.2-10.4z"/></svg><span>Nöbetçi<small>Vardiya & Mesai Planlayıcı</small></span></div>
  <div class="phone p1"><div class="screen"><img src="week.png" alt=""></div></div>
  <div class="phone p2"><div class="screen"><img src="free-week.png" alt=""></div></div>
  <div class="phone p3"><div class="screen"><img src="timeline-dark.png" alt=""></div></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const W = +q.get('w') || 1600, H = +q.get('h') || 1000;
  const stage = document.getElementById('stage');
  Object.assign(stage.style, { width: W + 'px', height: H + 'px' });
  const og = W / H > 1.7; // geniş og-image: telefonlar sağda, marka solda
  const s = og ? 0.62 : 1;
  const phones = [...document.querySelectorAll('.phone')];
  const pos = og ? [[490, 130], [725, 80], [960, 135]] : [[205, 150], [610, 88], [1015, 150]];
  phones.forEach((p, i) => { p.style.left = pos[i][0] + 'px'; p.style.top = pos[i][1] + 'px'; p.style.transform = `${getComputedStyle(p).transform === 'none' ? '' : getComputedStyle(p).transform} scale(${s})`; p.style.transformOrigin = 'top left'; });
  const brand = document.getElementById('brand');
  if (og) { Object.assign(brand.style, { left: '72px', top: '250px' }); } else brand.remove();
</script>
</body></html>
